<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>luststar &lt;3</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000;
      background-image: url('img/How.gif');
      background-repeat: repeat;
      background-position: center center;
      background-size: 130% auto;
      font-family: "Courier New", Courier, monospace;
      color: white;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Bottom gradient so the frame is readable over the busy GIF */
    body::after {
      content: '';
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32vh;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.72) 0%,
        rgba(0, 0, 0, 0.4) 40%,
        rgba(0, 0, 0, 0.1) 75%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 5;
    }

    /* Full-screen black overlay for page transitions */
    #transition-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #transition-overlay.active {
      opacity: 1;
    }

    /* -------- Frame -------- */
    #frame {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.2;
      color: #fff;
      white-space: pre;
      text-align: center;
      z-index: 10;
      text-shadow: 0 0 4px #000, 0 0 8px #000, 0 1px 0 #000, 0 -1px 0 #000;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #frame.exit {
      opacity: 0;
      transform: translateX(-50%) translateY(30px) scale(0.95);
    }

    #frame .line {
      display: block;
      white-space: pre;
    }

    .link-item {
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.15s ease, text-shadow 0.15s ease;
      text-shadow: 0 0 4px #000, 0 0 8px #000, 0 1px 0 #000, 0 -1px 0 #000;
    }
    .link-item:hover,
    .link-item:focus {
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 4px #000, 0 1px 0 #000, 0 -1px 0 #000;
      outline: none;
    }

    .cursor {
      display: inline-block;
      width: 1ch;
      opacity: 1;
    }
    .cursor.blinking { animation: blink 1s steps(1) infinite; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* -------- Music toggle -------- */
    #music-toggle {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      right: 24px;
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.15s ease, text-shadow 0.15s ease, opacity 0.4s ease;
      z-index: 10;
      text-shadow: 0 0 4px #000, 0 0 8px #000, 0 1px 0 #000, 0 -1px 0 #000;
    }
    #music-toggle.exit { opacity: 0; }
    #music-toggle:hover,
    #music-toggle:focus {
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 4px #000, 0 1px 0 #000, 0 -1px 0 #000;
      outline: none;
    }

    audio { display: none; }

    @media (max-width: 700px) {
      html, body { background-size: 110% auto; }
      body::after { height: 38vh; }
      #frame { font-size: 12px; }
      #music-toggle { font-size: 12px; right: 12px; }
    }
    @media (max-width: 480px) {
      #frame { font-size: 10px; }
      #music-toggle { font-size: 10px; }
    }
    @media (max-width: 380px) {
      #frame { font-size: 9px; }
    }
  </style>
</head>
<body>

  <div id="transition-overlay"></div>

  <div id="frame">
    <span class="line" id="line-top"></span>
    <span class="line" id="line-mid"></span>
    <span class="line" id="line-bottom"></span>
  </div>

  <div id="music-toggle" role="button" tabindex="0" aria-label="Toggle music">
    <span id="music-text"></span><span class="cursor" id="music-cursor">_</span>
  </div>

  <audio id="music" loop src="audio/Music.mp3"></audio>

  <script>
    const TYPE_SPEED = 150;
    const BORDER_SPEED = 25;
    const DELETE_SPEED = 45;
    const GAP_BETWEEN = 400;
    const EMAIL = 'business@lust.lol';
    const PAD = 2;
    const GAP = 3;

    const LINK_ITEMS = [
      { text: 'yt',      href: 'https://youtube.com/luststar' },
      { text: 'spotify', href: 'https://open.spotify.com/artist/4bP1qxGv79uyiXuUWfJew4?si=4d3abb9c525941e9' },
      { text: 'apple',   href: 'https://music.apple.com/us/artist/luststar/1527972241' },
      { text: 'ig',      href: 'https://instagram.com/theluststar' },
      { text: 'music',   href: '/music/' },
      { text: 'email',   href: null }
    ];

    const lineTop    = document.getElementById('line-top');
    const lineMid    = document.getElementById('line-mid');
    const lineBottom = document.getElementById('line-bottom');
    const overlay    = document.getElementById('transition-overlay');

    function computeBorder() {
      let inner = 0;
      LINK_ITEMS.forEach((spec, idx) => {
        inner += spec.text.length;
        if (idx < LINK_ITEMS.length - 1) inner += GAP;
      });
      const middleLen = 2 + 2 * PAD + inner;
      const width = middleLen - 2;
      return '+' + '-'.repeat(width) + '+';
    }
    const BORDER = computeBorder();

    const itemEls = [];

    (function buildMidRow() {
      lineMid.textContent = '';
      lineMid.appendChild(document.createTextNode('|' + ' '.repeat(PAD)));

      LINK_ITEMS.forEach((spec, idx) => {
        const el = document.createElement(spec.href ? 'a' : 'span');
        if (spec.href) {
          const isInternal = spec.href.startsWith('/');
          el.href = spec.href;
          if (!isInternal) {
            el.target = '_blank';
            el.rel = 'noopener';
          }
        } else {
          el.setAttribute('role', 'button');
          el.tabIndex = 0;
          el.setAttribute('aria-label', 'Copy email');
          el.id = 'email-item';
        }
        el.className = 'link-item';
        el.dataset.text = spec.text;

        const label = document.createElement('span');
        label.className = 'label';
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        cursor.textContent = '';

        el.appendChild(label);
        el.appendChild(cursor);
        lineMid.appendChild(el);

        itemEls.push({
          el, label, cursor,
          target: spec.text,
          isEmail: !spec.href,
          isInternalLink: spec.href && spec.href.startsWith('/')
        });

        if (idx < LINK_ITEMS.length - 1) {
          lineMid.appendChild(document.createTextNode(' '.repeat(GAP)));
        }
      });

      lineMid.appendChild(document.createTextNode(' '.repeat(PAD) + '|'));
    })();

    function typeStringInto(el, str, speed, onDone) {
      el.textContent = '';
      let i = 0;
      (function step() {
        if (i < str.length) {
          el.textContent = str.slice(0, ++i);
          setTimeout(step, speed);
        } else { onDone && onDone(); }
      })();
    }
    function typeItem(item, text, speed, onDone) {
      item.label.textContent = '';
      let i = 0;
      (function step() {
        if (i < text.length) {
          item.label.textContent = text.slice(0, ++i);
          setTimeout(step, speed);
        } else { onDone && onDone(); }
      })();
    }
    function deleteItem(item, speed, onDone) {
      const current = item.label.textContent;
      let i = current.length;
      (function step() {
        if (i > 0) {
          item.label.textContent = current.slice(0, --i);
          setTimeout(step, speed);
        } else { onDone && onDone(); }
      })();
    }

    function typeSequence(index) {
      if (index >= itemEls.length) { startMusicSequence(); return; }
      const item = itemEls[index];
      item.cursor.textContent = '_';
      item.cursor.classList.add('blinking');

      typeItem(item, item.target, TYPE_SPEED, () => {
        item.el.dataset.ready = 'true';
        if (!item.isEmail) item.cursor.classList.remove('blinking');
        setTimeout(() => typeSequence(index + 1), GAP_BETWEEN);
      });
    }

    // ============================================================
    // INTERNAL LINK EXIT ANIMATION + FADE
    // ============================================================
    const frameEl = document.getElementById('frame');
    const musicToggleEl = document.getElementById('music-toggle');
    let leaving = false;

    function exitTo(href) {
      if (leaving) return;
      leaving = true;
      frameEl.classList.add('exit');
      musicToggleEl.classList.add('exit');
      overlay.classList.add('active');

      setTimeout(() => {
        window.location.href = href;
      }, 450);
    }

    itemEls.forEach((item) => {
      if (!item.isInternalLink) return;
      item.el.addEventListener('click', (e) => {
        e.preventDefault();
        exitTo(item.el.getAttribute('href'));
      });
    });

    // ============================================================
    // EMAIL CLICK
    // ============================================================
    const emailItem = itemEls.find(i => i.isEmail);
    let emailBusy = false;

    function copyEmail() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(EMAIL).catch(() => fallbackCopy(EMAIL));
      } else { fallbackCopy(EMAIL); }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function handleEmailClick() {
      if (emailBusy) return;
      if (emailItem.el.dataset.ready !== 'true') return;
      emailBusy = true;
      emailItem.cursor.classList.remove('blinking');

      deleteItem(emailItem, 60, () => {
        typeItem(emailItem, EMAIL, 55, () => {
          copyEmail();
          setTimeout(() => {
            deleteItem(emailItem, 45, () => {
              typeItem(emailItem, 'copied!', 55, () => {
                setTimeout(() => {
                  deleteItem(emailItem, 45, () => {
                    typeItem(emailItem, 'email', 60, () => {
                      emailItem.cursor.classList.add('blinking');
                      emailBusy = false;
                    });
                  });
                }, 900);
              });
            });
          }, 800);
        });
      });
    }

    emailItem.el.addEventListener('click', handleEmailClick);
    emailItem.el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleEmailClick();
      }
    });

    // ============================================================
    // MUSIC TOGGLE
    // ============================================================
    const music = document.getElementById('music');
    const musicText = document.getElementById('music-text');
    const musicCursor = document.getElementById('music-cursor');

    let musicBusy = false;
    let musicIsOn = false;
    let initialSequenceDone = false;

    music.volume = 0.2;

    function startMusicSequence() {
      musicCursor.textContent = '_';
      musicCursor.classList.add('blinking');
      const target = musicIsOn ? 'music: on' : 'music: off';
      let i = 0;
      (function type() {
        if (i < target.length) {
          musicText.textContent = target.slice(0, ++i);
          setTimeout(type, TYPE_SPEED);
        } else {
          initialSequenceDone = true;
          typeStringInto(lineBottom, BORDER, BORDER_SPEED);
        }
      })();
    }

    function animateMusicLabel(newLabel) {
      const current = musicText.textContent;
      let i = current.length;
      (function del() {
        if (i > 0) {
          musicText.textContent = current.slice(0, --i);
          setTimeout(del, DELETE_SPEED);
        } else {
          let j = 0;
          (function type() {
            if (j < newLabel.length) {
              musicText.textContent = newLabel.slice(0, ++j);
              setTimeout(type, TYPE_SPEED);
            } else {
              musicCursor.classList.add('blinking');
              musicBusy = false;
            }
          })();
        }
      })();
    }

    function handleMusicToggle() {
      if (musicBusy) return;
      if (!initialSequenceDone) return;
      musicBusy = true;
      musicCursor.classList.remove('blinking');

      musicIsOn = !musicIsOn;
      const target = musicIsOn ? 'music: on' : 'music: off';

      try {
        if (musicIsOn) {
          music.muted = false;
          if (music.volume === 0) music.volume = 0.2;
          const p = music.play();
          if (p && p.catch) p.catch((err) => console.warn('Playback blocked:', err));
        } else {
          music.muted = true;
          music.pause();
        }
      } catch (e) { console.warn('Audio toggle error:', e); }

      animateMusicLabel(target);
    }

    musicToggleEl.addEventListener('click', handleMusicToggle);
    musicToggleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleMusicToggle();
      }
    });

    function resyncLabelToAudio() {
      const actuallyPlaying = !music.paused && !music.muted;
      if (actuallyPlaying === musicIsOn) return;
      if (musicBusy) return;
      if (!initialSequenceDone) return;
      musicIsOn = actuallyPlaying;
      musicBusy = true;
      musicCursor.classList.remove('blinking');
      animateMusicLabel(musicIsOn ? 'music: on' : 'music: off');
    }
    music.addEventListener('play',  resyncLabelToAudio);
    music.addEventListener('pause', resyncLabelToAudio);

    // ============================================================
    // ENTRY: fade overlay out on load
    // ============================================================
    // Start with overlay fully opaque, then remove .active so it fades out
    overlay.style.transition = 'none';
    overlay.classList.add('active');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        overlay.style.transition = '';
        overlay.classList.remove('active');
      });
    });

    // ============================================================
    // KICK OFF
    // ============================================================
    typeStringInto(lineTop, BORDER, BORDER_SPEED, () => {
      setTimeout(() => typeSequence(0), 150);
    });

    try {
      const p = music.play();
      if (p && p.then) {
        p.then(() => {
          if (!initialSequenceDone) musicIsOn = true;
        }).catch(() => {});
      }
    } catch (e) {}
  </script>

</body>
</html>
